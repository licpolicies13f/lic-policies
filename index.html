<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A private, offline LIC policy tracker that works with local Excel files."
    />
    <meta name="theme-color" content="#0756a0" />
    <title>LIC Policy Tracker</title>
    <style>
      .startup-screen {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #10213d;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(circle at 15% 15%, #dbeafe 0, transparent 34%),
          radial-gradient(circle at 85% 10%, #fef3c7 0, transparent 30%),
          #f7f9fc;
      }

      .startup-card {
        padding: 28px 34px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 24px 60px rgba(15, 60, 110, 0.12);
        backdrop-filter: blur(18px);
      }

      .startup-card strong,
      .startup-card span {
        display: block;
      }

      .startup-card strong {
        font-size: 20px;
      }

      .startup-card span {
        margin-top: 7px;
        color: #63738c;
        font-size: 14px;
      }
    </style>
    <script>
      window.addEventListener("error", function (event) {
        var message =
          event && event.message
            ? event.message
            : "The offline tracker could not start.";
        window.setTimeout(function () {
          var status = document.querySelector(".startup-card span");
          if (status) {
            status.textContent = "Startup error: " + message;
            status.style.color = "#b91c1c";
          }
        }, 0);
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div class="startup-screen">
        <div class="startup-card">
          <strong>LIC Policy Tracker</strong>
          <span>Loading your offline records…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
